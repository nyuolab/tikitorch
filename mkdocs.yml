site_name: TikiTorch
site_description: PyTorch-shaped infrastructure for tropical and hard-routed deep learning.
repo_url: https://github.com/nyuolab/tikitorch
repo_name: nyuolab/tikitorch
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: true
            members_order: source
            docstring_section_style: list
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - Get started:
      - Installation: get-started/installation.md
      - Quickstart: get-started/quickstart.md
      - Migrating from PyTorch: guide/migration.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Notebook tutorials: guide/notebooks.md
      - Runnable examples: tutorials/examples.md
  - User guide:
      - Tropical algebra: guide/foundations.md
      - Choosing a model and recipe: guide/choosing-a-model.md
      - Architectures: guide/architecture.md
      - Auditing closure: guide/closure.md
      - Why tropical for ML/DL: guide/why-tropical-ml.md
      - Tropical geometry of neural nets: guide/tropical-geometry.md
      - Beyond deep learning: guide/beyond-deep-learning.md
      - FAQ & troubleshooting: guide/faq.md
  - API reference:
      - API overview: api/index.md
      - Core:
          - functional: api/functional.md
          - nn (layers): api/nn.md
          - models: api/models.md
          - optim: api/optim.md
          - train: api/train.md
      - Runtime and verification:
          - audit (closure): api/audit.md
          - backend: api/backend.md
          - serialization: api/serialization.md
          - profile: api/profile.md
      - Specialized:
          - autodiff (route certificates): api/autodiff.md
          - fpga: api/fpga.md
          - forward-forward: api/forward_forward.md
          - planning: api/planning.md
      - Mathematics and algorithms:
          - classical: api/classical.md
          - geometry: api/geometry.md
          - prune: api/prune.md
          - algorithmic: api/algorithmic.md
  - Research:
      - Scope and evidence: research/index.md
      - Claim ledger: research/CLAIM_LEDGER.md
