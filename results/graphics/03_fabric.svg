    <text x="330" y="160" fill="#4FD1E0" font-size="14">hidden state x (bf16) — one hop down the chain  ⟶</text>
    <text x="1458" y="160" fill="#F2A93B" font-size="14" text-anchor="end">⟵  error ε — one hop back up</text>
    <line x1="300" y1="170" x2="349" y2="196" stroke="#4FD1E0" stroke-width="1.5" opacity="0.5"/>
    <line x1="1420" y1="170" x2="1399" y2="196" stroke="#F2A93B" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- physical transport note -->
  <line x1="240" y1="470" x2="1458" y2="470" stroke="#44506A" stroke-width="2" stroke-dasharray="6 5"/>
  <g stroke="#44506A" stroke-width="1.5">
    <line x1="349" y1="440" x2="349" y2="470"/><line x1="499" y1="440" x2="499" y2="470"/>
