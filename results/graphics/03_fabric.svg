<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4FD1E0"/>
    </marker>
    <marker id="fO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F2A93B"/>
    </marker>
  </defs>

  <rect width="1500" height="950" fill="#0B1120"/>
  <text x="750" y="48" text-anchor="middle" fill="#FFFFFF" font-size="29" font-weight="700">The fabric — model-parallel PC transformer on 8 × AWS F2 FPGAs</text>
  <text x="750" y="80" text-anchor="middle" fill="#8FA1BF" font-size="16">one transformer block per physical chip · neighbour-only messages · no global gradient, no all-reduce</text>

  <!-- Host -->
  <rect x="40" y="200" width="200" height="240" rx="12" fill="#111A2E" stroke="#8FA1BF" stroke-width="2"/>
  <text x="140" y="232" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">x86 HOST</text>
  <g font-size="13" fill="#B9C6DB">
    <text x="60" y="262">• batch loader (char-64)</text>
    <text x="60" y="288">• PCIe message relay</text>
    <text x="60" y="314">• cosine LR schedule</text>
    <text x="60" y="340">• grad ACCUM = 8</text>
    <text x="60" y="366">• Gate-C verify (2.75 GB)</text>
    <text x="60" y="392">• no math on the host —</text>
    <text x="68" y="412">  all compute is on-chip</text>
  </g>

  <!-- Chips -->
  <g>
    <!-- chip boxes -->
    <g font-size="14" fill="#DCE6F5" text-anchor="middle">
      <rect x="290" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
      <text x="349" y="230" font-weight="700">CHIP 0</text>
      <text x="349" y="254" fill="#8FA1BF" font-size="12">EMB + BLK 0</text>

      <rect x="440" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
      <text x="499" y="230" font-weight="700">CHIP 1</text>
      <text x="499" y="254" fill="#8FA1BF" font-size="12">BLK 1</text>

      <rect x="590" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
      <text x="649" y="230" font-weight="700">CHIP 2</text>
      <text x="649" y="254" fill="#8FA1BF" font-size="12">BLK 2</text>

      <rect x="740" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
      <text x="799" y="230" font-weight="700">CHIP 3</text>
      <text x="799" y="254" fill="#8FA1BF" font-size="12">BLK 3</text>

      <rect x="890" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
