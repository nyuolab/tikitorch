      <rect x="1040" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
      <text x="1099" y="230" font-weight="700">CHIP 5</text>
      <text x="1099" y="254" fill="#8FA1BF" font-size="12">BLK 5</text>

      <rect x="1190" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
      <text x="1249" y="230" font-weight="700">CHIP 6</text>
      <text x="1249" y="254" fill="#8FA1BF" font-size="12">BLK 6</text>

      <rect x="1340" y="200" width="118" height="240" rx="10" fill="#141F38" stroke="#F2A93B" stroke-width="2"/>
      <text x="1399" y="230" font-weight="700">CHIP 7</text>
      <text x="1399" y="254" fill="#8FA1BF" font-size="12">BLK 7 + HEAD/CE</text>
    </g>

    <!-- per-chip contents -->
    <g font-size="11" fill="#5B6B85" text-anchor="middle">
      <text x="349" y="300">mult-free fwd</text><text x="349" y="318">BF16 bwd</text><text x="349" y="336">dyadic-Adam</text>
      <text x="499" y="300">mult-free fwd</text><text x="499" y="318">BF16 bwd</text><text x="499" y="336">dyadic-Adam</text>
      <text x="649" y="300">mult-free fwd</text><text x="649" y="318">BF16 bwd</text><text x="649" y="336">dyadic-Adam</text>
