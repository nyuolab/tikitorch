  <text x="340" y="790" fill="#5B6B85" font-size="13">time →   ·   staleness ladder is depth-proportional [7 … 0] — the real hardware mechanism, penalty recovered at window ≥ depth</text>

  <!-- side notes -->
  <g font-size="14" fill="#B9C6DB">
    <text x="1060" y="620">✓ pipelined masters <tspan fill="#58C97D" font-weight="700">BIT-IDENTICAL</tspan> to serial [M]</text>
    <text x="1060" y="650">✓ pipeline overlap 1.79× measured (2 slots)</text>
    <text x="1060" y="680">◔ S=8 slot AFI in flight — DDR-only cost,</text>
    <text x="1078" y="702">csynth-gated (BRAM 61% / URAM 48%)</text>
    <text x="1060" y="732">✓ no barrier anywhere — chips never wait</text>
    <text x="1078" y="754">for a global gradient</text>
  </g>

  <!-- bottom measured band -->
  <rect x="40" y="820" width="1418" height="100" rx="12" fill="#0F2418" stroke="#58C97D" stroke-width="2"/>
  <text x="60" y="850" fill="#58C97D" font-size="15" font-weight="700">MEASURED (agfi-0a08046c7d64090ff · D=64 H=2 FFN=256 SEQ=64 · kernel 150 MHz):</text>
  <g font-size="14.5" fill="#DCE6F5">
    <text x="60" y="880">FWD kick 53.5–57.6 ms · BWD kick 91.3–99.0 ms · 0.50 steps/s → <tspan font-weight="700">258 tok/s</tspan> pipelined (serial 0.28)</text>
    <text x="760" y="880">3 chips: <tspan fill="#58C97D" font-weight="700">bpb 3.187 CONVERGED</tspan>, Δ0.14 vs CPU twin · 8 chips × 8 blocks: <tspan fill="#58C97D" font-weight="700">bpb 3.675</tspan>, Gate-C clean</text>
    <text x="60" y="906" fill="#8FA1BF" font-size="13">remaining quality gap = 0.26 bpb silicon gradient-noise premium — attacked by in-chip batch lanes (grad noise ∝ 1/√N)</text>
  </g>
</svg>
