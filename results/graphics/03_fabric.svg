  </g>
  <text x="750" y="496" text-anchor="middle" fill="#8FA1BF" font-size="13.5">physical transport today: host PCIe relay (the measured bottleneck at 8-chip scale) · next: TcpLink chip-to-chip, protocol already scale-invariant → multi-box</text>

  <!-- ===== 1F1B pipeline timeline ===== -->
  <text x="340" y="560" fill="#FFFFFF" font-size="18" font-weight="700">Bubble-free 1F1B pipeline — S slots in flight <tspan fill="#5B6B85" font-size="13" font-weight="400">(4 of 8 chips shown)</tspan></text>

  <g font-size="13" fill="#8FA1BF" text-anchor="end">
    <text x="326" y="636">chip 0</text>
    <text x="326" y="676">chip 1</text>
    <text x="326" y="716">chip 2</text>
    <text x="326" y="756">chip 3</text>
  </g>

