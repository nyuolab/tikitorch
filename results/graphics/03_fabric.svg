    </g>

    <!-- forward x arrows -->
    <g stroke="#4FD1E0" stroke-width="3">
      <line x1="410" y1="368" x2="438" y2="368" marker-end="url(#fC)"/>
      <line x1="560" y1="368" x2="588" y2="368" marker-end="url(#fC)"/>
