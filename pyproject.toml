[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikitorch"
version = "0.2.0"
description = "PyTorch-shaped infrastructure for tropical and hard-routed deep learning."
readme = "README.md"
# This is the validated support window in .github/workflows/ci.yml. Widen it
# together with the test matrix, rather than advertising untested interpreters.
requires-python = ">=3.9,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "RespectableGlioma (EKO)" },
]
keywords = [
    "tropical-semiring",
    "max-plus",
    "min-plus",
    "morphological-networks",
    "fpga",
    "multiplier-free",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# scipy powers tikitorch.geometry.newton_polytope (convex hull); it is optional
# at runtime (the util degrades to a warning) but required to exercise the
# geometry tests, so it ships in the dev extra.
dev = ["pytest>=7.4", "ruff==0.13.0", "scipy>=1.10"]
# The FPGA Python namespace uses ctypes from the standard library, so this marker
# extra intentionally adds no pip dependencies. Building a native driver or reproducing
# the complete HLS/HDK path requires a source checkout, compatible AWS/Xilinx tooling,
# and the instructions in tikitorch/fpga/BUILD_NATIVE.md and
# tikitorch/hardware/BUILD_GUIDE.md; a wheel alone is not a hardware build environment.
fpga = []
# Build the API-reference docs site: `pip install -e ".[docs]"` then `mkdocs build`.
docs = ["mkdocs-material", "mkdocstrings[python]"]
# Real-MNIST examples load torchvision lazily; synthetic --smoke paths do not
# require it.
vision = ["torchvision"]
# Build and validate release archives locally: `pip install -e ".[build]"`, then
# `python -m build` and `python -m twine check dist/*`.
build = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/nyuolab/tikitorch"
Repository = "https://github.com/nyuolab/tikitorch"
Issues = "https://github.com/nyuolab/tikitorch/issues"
Documentation = "https://github.com/nyuolab/tikitorch/tree/main/docs"
Changelog = "https://github.com/nyuolab/tikitorch/blob/main/CHANGELOG.md"
FPGA-Source-Guide = "https://github.com/nyuolab/tikitorch/blob/main/tikitorch/hardware/BUILD_GUIDE.md"

[project.scripts]
# Run the model's registered software closure checks from the shell. This is not a
# synthesis report and does not establish physical DSP utilization:
#   tt-closure tikitorch.models:TropicalForwardForward
tt-closure = "tikitorch.cli:main"

[tool.setuptools.packages.find]
include = ["tikitorch*"]

[tool.setuptools.package-data]
tikitorch = [
    "hardware/**/*.hpp",
    "hardware/**/*.cpp",
    "hardware/**/*.tcl",
    "hardware/*.md",
    "hardware/**/*.md",
    "fpga/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py39"
required-version = "==0.13.0"

[tool.ruff.lint]
# Keep CI's lint contract explicit. These are Ruff's established default
# correctness rules; style-only rule families can be adopted deliberately in a
# dedicated cleanup instead of appearing when Ruff changes its defaults.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files curate the public API by re-importing symbols. The package root
# intentionally initializes foundational namespaces before its convenience re-exports,
# so those imports are neither dead code nor accidentally late.
"__init__.py" = ["E402", "F401"]
# Tests favour compact setup lines (semicolons, short throwaway names). The
# bug-catching F-rules (unused import/var, shadowing) stay ON.
"tests/**" = ["E402", "E701", "E702", "E731", "E741"]
# Example scripts are didactic: the compact one-liners (loss.backward(); step())
# are the teaching point, so the layout rules are relaxed here.
"examples/**" = ["E401", "E402", "E701", "E702", "E731", "E741"]
"scripts/**" = ["E401", "E402", "E701", "E702", "E731", "E741"]
# Notebooks re-import and re-assign freely across cells by design; lint only for
# genuine syntax/logic errors, not style or per-cell redefinitions.
"notebooks/**" = ["E401", "E402", "E701", "E702", "E731", "E741", "F401", "F811", "F841"]
# Research-derived library modules ported (near-)verbatim from the PC/silicon
# experiments: the `fabric` distributed-training subpackage and the predictive-coding
# layers use the compact `l` (layer/link) index and semicolon setup lines idiomatic in
# that source. The bug-catching F-rules stay ON; only the cosmetic naming/layout
# E-rules (E741 ambiguous name, E702 semicolon) are relaxed for these files.
"tikitorch/fabric/**" = ["E702", "E741"]
"tikitorch/nn/predictive_coding.py" = ["E741"]
# Silicon reference runners that live under the package are research Python (treated
# like scripts/): relax layout rules, keep the F-rules on.
"tikitorch/fpga/silicon/**" = ["E401", "E402", "E701", "E702", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ensure the checkout under test wins over any separately installed TikiTorch build.
pythonpath = ["."]
# `slow` marks end-to-end training tests that validate research/learning claims
# (a model reaches some accuracy), NOT library correctness. They dominate runtime
# and are inherently stochastic, so they are DESELECTED by default: plain `pytest`
# and CI run the fast building-block suite (closure, exactness, gradchecks). Run
# the training tests on demand with `pytest -m slow`.
addopts = ["-m", "not slow and not kernel"]
markers = [
    "slow: end-to-end training test (research/learning claim); deselected by default, run with `-m slow`",
    "kernel: builds + ctypes-loads a native HLS kernel in-process (can segfault the run; the kernel math is covered by the `csim` CI job). Deselected by default, run with `-m kernel`",
]
