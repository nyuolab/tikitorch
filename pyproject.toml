[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikitorch"
version = "0.2.0"
description = "A tropical-semiring deep-learning library: multiplier-free, FPGA-native training, PyTorch-idiomatic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "RespectableGlioma (EKO)" },
]
keywords = [
    "tropical-semiring",
    "max-plus",
    "min-plus",
    "morphological-networks",
    "fpga",
    "multiplier-free",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
# scipy powers tikitorch.geometry.newton_polytope (convex hull); it is optional
# at runtime (the util degrades to a warning) but required to exercise the
# geometry tests, so it ships in the dev extra.
dev = ["pytest", "ruff", "scipy"]
# The FPGA backend is pure-Python + ctypes (stdlib); the native driver is built
# out-of-band against the Xilinx toolchain (see tikitorch/fpga/BUILD_NATIVE.md),
# so this extra intentionally adds no pip deps. It exists as a documented marker
# (`pip install tikitorch[fpga]`); pybind11 / pyxrt are out-of-band build hints.
fpga = []
# Build the API-reference docs site: `pip install -e ".[docs]"` then `mkdocs build`.
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/nyuolab/tikitorch"
Repository = "https://github.com/nyuolab/tikitorch"
Issues = "https://github.com/nyuolab/tikitorch/issues"

[tool.setuptools.packages.find]
include = ["tikitorch*"]

[tool.setuptools.package-data]
tikitorch = [
    "hardware/**/*.hpp",
    "hardware/**/*.cpp",
    "hardware/**/*.tcl",
    "hardware/*.md",
    "hardware/**/*.md",
    "fpga/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# __init__.py files curate the public API by re-importing symbols; those imports
# are intentional re-exports, not dead code.
"__init__.py" = ["F401"]
# Tests favour compact setup lines (semicolons, short throwaway names). The
# bug-catching F-rules (unused import/var, shadowing) stay ON.
"tests/**" = ["E402", "E701", "E702", "E731", "E741"]
# Example scripts are didactic: the compact one-liners (loss.backward(); step())
# are the teaching point, so the layout rules are relaxed here.
"examples/**" = ["E401", "E402", "E701", "E702", "E731", "E741"]
"scripts/**" = ["E401", "E402", "E701", "E702", "E731", "E741"]
# Notebooks re-import and re-assign freely across cells by design; lint only for
# genuine syntax/logic errors, not style or per-cell redefinitions.
"notebooks/**" = ["E401", "E402", "E701", "E702", "E731", "E741", "F401", "F811", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` marks end-to-end training tests that validate research/learning claims
# (a model reaches some accuracy), NOT library correctness. They dominate runtime
# and are inherently stochastic, so they are DESELECTED by default: plain `pytest`
# and CI run the fast building-block suite (closure, exactness, gradchecks). Run
# the training tests on demand with `pytest -m slow`.
addopts = ["-m", "not slow"]
markers = [
    "slow: end-to-end training test (research/learning claim); deselected by default, run with `-m slow`",
]
