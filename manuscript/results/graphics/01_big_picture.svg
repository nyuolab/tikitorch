<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DCE6F5"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4FD1E0"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#0B1120"/>

  <!-- Title -->
  <text x="700" y="58" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="700">PC-TikiTorch</text>
  <text x="700" y="92" text-anchor="middle" fill="#8FA1BF" font-size="19">Training language models on FPGA fabric — no GPUs, no global backprop, no multipliers</text>

  <!-- ===================== Pillar 1: Tropical / dyadic ===================== -->
  <rect x="45" y="130" width="410" height="310" rx="14" fill="#111A2E" stroke="#4FD1E0" stroke-width="2"/>
  <rect x="45" y="130" width="410" height="46" rx="14" fill="#4FD1E0" opacity="0.15"/>
  <text x="250" y="160" text-anchor="middle" fill="#4FD1E0" font-size="20" font-weight="700">TROPICAL / DYADIC ARITHMETIC</text>
  <text x="250" y="196" text-anchor="middle" fill="#8FA1BF" font-size="14" font-style="italic">the compute substrate</text>
  <text x="70" y="228" fill="#DCE6F5" font-size="15">• (max, +) semiring:  a ⊕ b = max(a,b),  a ⊗ b = a + b</text>
  <text x="70" y="256" fill="#DCE6F5" font-size="15">• weights quantized to ±2ᵏ → a multiply is a shift</text>
  <text x="70" y="284" fill="#DCE6F5" font-size="15">• matmul = shifts + adds, nothing else</text>
  <text x="70" y="312" fill="#DCE6F5" font-size="15">• invariant: DSP_MULT = 0 in the deploy forward</text>
  <!-- mini graphic: x*2^k => x<<k -->
  <rect x="90" y="340" width="130" height="52" rx="8" fill="#0B1120" stroke="#33415C"/>
  <text x="155" y="366" text-anchor="middle" fill="#8FA1BF" font-size="16" font-family="Menlo, monospace">x · 2ᵏ</text>
  <line x1="140" y1="352" x2="172" y2="378" stroke="#E0596B" stroke-width="2.5"/>
  <line x1="172" y1="352" x2="140" y2="378" stroke="#E0596B" stroke-width="2.5"/>
  <line x1="228" y1="366" x2="278" y2="366" stroke="#4FD1E0" stroke-width="2.5" marker-end="url(#arrC)"/>
  <rect x="286" y="340" width="130" height="52" rx="8" fill="#0B1120" stroke="#4FD1E0"/>
  <text x="351" y="372" text-anchor="middle" fill="#4FD1E0" font-size="18" font-family="Menlo, monospace">x &lt;&lt; k</text>
  <text x="250" y="424" text-anchor="middle" fill="#5B6B85" font-size="13">no multiplier ever instantiated</text>

  <!-- ===================== Pillar 2: Predictive coding ===================== -->
  <rect x="495" y="130" width="410" height="310" rx="14" fill="#111A2E" stroke="#B48CFF" stroke-width="2"/>
  <rect x="495" y="130" width="410" height="46" rx="14" fill="#B48CFF" opacity="0.15"/>
  <text x="700" y="160" text-anchor="middle" fill="#B48CFF" font-size="20" font-weight="700">PREDICTIVE CODING</text>
  <text x="700" y="196" text-anchor="middle" fill="#8FA1BF" font-size="14" font-style="italic">the learning rule</text>
  <text x="520" y="228" fill="#DCE6F5" font-size="15">• every layer carries its own error units ε</text>
  <text x="520" y="256" fill="#DCE6F5" font-size="15">• Δw computed from purely LOCAL signals</text>
  <text x="520" y="284" fill="#DCE6F5" font-size="15">• messages: hidden x ↓ and error ε ↑ — one hop only</text>
  <text x="520" y="312" fill="#DCE6F5" font-size="15">• no global gradient, no all-reduce, no sync barrier</text>
  <!-- mini graphic: two layers with local eps -->
  <rect x="560" y="338" width="110" height="40" rx="8" fill="#0B1120" stroke="#33415C"/>
  <text x="615" y="363" text-anchor="middle" fill="#DCE6F5" font-size="14">layer ℓ</text>
  <rect x="730" y="338" width="110" height="40" rx="8" fill="#0B1120" stroke="#33415C"/>
  <text x="785" y="363" text-anchor="middle" fill="#DCE6F5" font-size="14">layer ℓ+1</text>
  <line x1="672" y1="348" x2="726" y2="348" stroke="#4FD1E0" stroke-width="2.5" marker-end="url(#arrC)"/>
  <text x="699" y="340" text-anchor="middle" fill="#4FD1E0" font-size="12">x</text>
  <line x1="728" y1="370" x2="674" y2="370" stroke="#F2A93B" stroke-width="2.5" marker-end="url(#arrA)"/>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#F2A93B"/>
  </marker>
  <text x="701" y="388" text-anchor="middle" fill="#F2A93B" font-size="12">ε</text>
  <circle cx="615" cy="404" r="13" fill="none" stroke="#F2A93B" stroke-width="2"/>
  <text x="615" y="409" text-anchor="middle" fill="#F2A93B" font-size="13">ε</text>
  <circle cx="785" cy="404" r="13" fill="none" stroke="#F2A93B" stroke-width="2"/>
  <text x="785" y="409" text-anchor="middle" fill="#F2A93B" font-size="13">ε</text>
  <text x="700" y="432" text-anchor="middle" fill="#5B6B85" font-size="13">credit assignment without a backward pass through the net</text>

  <!-- ===================== Pillar 3: FPGA fabric ===================== -->
  <rect x="945" y="130" width="410" height="310" rx="14" fill="#111A2E" stroke="#F2A93B" stroke-width="2"/>
  <rect x="945" y="130" width="410" height="46" rx="14" fill="#F2A93B" opacity="0.15"/>
  <text x="1150" y="160" text-anchor="middle" fill="#F2A93B" font-size="20" font-weight="700">FPGA FABRIC</text>
  <text x="1150" y="196" text-anchor="middle" fill="#8FA1BF" font-size="14" font-style="italic">the machine</text>
  <text x="970" y="228" fill="#DCE6F5" font-size="15">• AWS F2: one transformer block per physical chip</text>
  <text x="970" y="256" fill="#DCE6F5" font-size="15">• BF16 multiplies spent ONLY on backward + optimizer</text>
  <text x="970" y="284" fill="#DCE6F5" font-size="15">• kernel @ 150 MHz behind a CDC; bit-exact gates</text>
  <text x="970" y="312" fill="#DCE6F5" font-size="15">• TcpLink transport → multi-box scale-out</text>
  <!-- mini graphic: 3 chips chained -->
  <g>
    <rect x="1000" y="342" width="84" height="56" rx="6" fill="#0B1120" stroke="#F2A93B"/>
    <rect x="1128" y="342" width="84" height="56" rx="6" fill="#0B1120" stroke="#F2A93B"/>
    <rect x="1256" y="342" width="84" height="56" rx="6" fill="#0B1120" stroke="#F2A93B"/>
    <text x="1042" y="376" text-anchor="middle" fill="#DCE6F5" font-size="13">BLK 0</text>
    <text x="1170" y="376" text-anchor="middle" fill="#DCE6F5" font-size="13">BLK 1</text>
    <text x="1298" y="376" text-anchor="middle" fill="#DCE6F5" font-size="13">BLK 2</text>
    <line x1="1086" y1="360" x2="1124" y2="360" stroke="#4FD1E0" stroke-width="2.5" marker-end="url(#arrC)"/>
    <line x1="1214" y1="360" x2="1252" y2="360" stroke="#4FD1E0" stroke-width="2.5" marker-end="url(#arrC)"/>
    <line x1="1254" y1="382" x2="1216" y2="382" stroke="#F2A93B" stroke-width="2.5" marker-end="url(#arrA)"/>
    <line x1="1126" y1="382" x2="1088" y2="382" stroke="#F2A93B" stroke-width="2.5" marker-end="url(#arrA)"/>
  </g>
  <text x="1150" y="428" text-anchor="middle" fill="#5B6B85" font-size="13">a layer = a chip; the rule is fabric-native</text>

  <!-- Convergence arrows -->
  <line x1="250" y1="446" x2="600" y2="520" stroke="#DCE6F5" stroke-width="2" marker-end="url(#arrW)" opacity="0.7"/>
  <line x1="700" y1="446" x2="700" y2="520" stroke="#DCE6F5" stroke-width="2" marker-end="url(#arrW)" opacity="0.7"/>
  <line x1="1150" y1="446" x2="800" y2="520" stroke="#DCE6F5" stroke-width="2" marker-end="url(#arrW)" opacity="0.7"/>

  <!-- ===================== Measured today ===================== -->
  <rect x="120" y="530" width="1160" height="170" rx="14" fill="#0F2418" stroke="#58C97D" stroke-width="2.5"/>
  <text x="700" y="565" text-anchor="middle" fill="#58C97D" font-size="21" font-weight="700">★ ON SILICON TODAY — MEASURED</text>
  <g font-size="15" fill="#DCE6F5">
    <rect x="150" y="585" width="540" height="42" rx="8" fill="#0B1120" stroke="#2C4A38"/>
    <text x="420" y="611" text-anchor="middle">3-chip PC transformer <tspan fill="#58C97D" font-weight="700">CONVERGED — bpb 3.187</tspan> (Δ0.14 vs exact CPU twin)</text>
    <rect x="710" y="585" width="540" height="42" rx="8" fill="#0B1120" stroke="#2C4A38"/>
    <text x="980" y="611" text-anchor="middle"><tspan fill="#58C97D" font-weight="700">8 chips × 8 blocks train</tspan> — bpb 3.675, Gate-C clean (2.75 GB verified)</text>
    <rect x="150" y="640" width="540" height="42" rx="8" fill="#0B1120" stroke="#2C4A38"/>
    <text x="420" y="666" text-anchor="middle">pipelined <tspan fill="#58C97D" font-weight="700">258 tok/s</tspan>, bit-identical to serial · best run bpb 3.093</text>
    <rect x="710" y="640" width="540" height="42" rx="8" fill="#0B1120" stroke="#2C4A38"/>
    <text x="980" y="666" text-anchor="middle">gradients within <tspan fill="#58C97D" font-weight="700">1 bf16 ULP</tspan> of the CPU golden · DSP_MULT = 0</text>
  </g>

  <line x1="700" y1="706" x2="700" y2="746" stroke="#DCE6F5" stroke-width="2" marker-end="url(#arrW)" opacity="0.7"/>

  <!-- ===================== North star ===================== -->
  <rect x="220" y="756" width="960" height="88" rx="14" fill="#111A2E" stroke="#8FA1BF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="700" y="792" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">NORTH STAR <tspan fill="#8FA1BF" font-size="15" font-weight="400">[projected]</tspan></text>
  <text x="700" y="822" text-anchor="middle" fill="#B9C6DB" font-size="16">a ~124M-parameter coherent-Shakespeare LM trained end-to-end on multi-F2 fabric · next rung: the 30M rebuild (D=256, BPE)</text>

  <text x="700" y="878" text-anchor="middle" fill="#44506A" font-size="13">tikitorch · branch tropical-predictive-coding · 2026-07</text>
</svg>
