name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with torch + numpy + dev extras)
        run: |
          python -m pip install --upgrade pip
          # torch + numpy are runtime deps; install them explicitly (CPU wheels)
          # so the matrix doesn't depend on resolver luck, then editable-install
          # the package and its dev extras (pytest + ruff).
          pip install torch numpy --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint with ruff (skips gracefully if unavailable)
        run: |
          # ruff is configured in pyproject ([tool.ruff]) and ships in the dev
          # extra. If it's somehow not present, skip rather than fail the build.
          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check .
          else
            echo "ruff not available; skipping lint"
          fi

      - name: Run tests
        run: |
          # Runs the fast building-block suite. The `slow` end-to-end training
          # tests are deselected by default (addopts in pyproject) — they assert
          # research/learning claims, not library correctness, and are run on
          # demand with `pytest -m slow`. The board-dependent FPGA tests also
          # self-skip without hardware, so the suite is green on a stock runner.
          python -m pytest -q

  csim:
    name: csim (HLS kernel testbenches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile + run the HLS kernel CSIM testbenches
        run: |
          # The bundled HLS kernels compile as plain C++ (the forge_hls_types.hpp
          # shim maps ap_int<> to int16/int32 under g++), so their silicon-validated
          # testbenches run on a stock runner with NO Xilinx toolchain — corroborating
          # the multiplier-free kernel math (DSP=0 closure) on every push, no board.
          set -ex
          HLS=tikitorch/hardware/hls/forge_kernels
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step.cpp "$HLS"/forge_train_step_tb.cpp -o /tmp/tb_lm
          /tmp/tb_lm
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step_morph.cpp "$HLS"/forge_train_step_morph_tb.cpp -o /tmp/tb_morph
          /tmp/tb_morph
          # dyadic MuZero forward kernel (zero-DSP shift+add datapath)
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step_muzero.cpp "$HLS"/forge_train_step_muzero_tb.cpp -o /tmp/tb_muzero
          /tmp/tb_muzero
          # dyadic MuZero ON-CHIP TRAINING kernel (zero-DSP backward: shift grad-input,
          # sign-product weight grads, SignSGD on int16 shadows -> converges in CSIM)
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step_muzero_train.cpp "$HLS"/forge_train_step_muzero_train_tb.cpp -o /tmp/tb_muzero_train
          /tmp/tb_muzero_train

  docs:
    name: docs (mkdocs build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the API docs site
        run: |
          # mkdocstrings reads the in-source docstrings statically (griffe), so the
          # API reference can't drift from the code. Plain `build` (not --strict):
          # it fails on broken nav/refs/yaml but tolerates the docstring-param
          # annotation warnings (the partial-typing item tracked separately).
          python -m pip install --upgrade pip
          pip install mkdocs-material "mkdocstrings[python]"
          mkdocs build
