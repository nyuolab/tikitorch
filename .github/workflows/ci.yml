name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with torch + numpy + dev extras)
        run: |
          python -m pip install --upgrade pip
          # torch + numpy are runtime deps; install them explicitly (CPU wheels)
          # so the matrix doesn't depend on resolver luck, then editable-install
          # the package and its dev extras (pytest + ruff).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: |
          # Runs the fast building-block suite. The `slow` end-to-end training
          # tests are deselected by default (addopts in pyproject) — they assert
          # research/learning claims, not library correctness, and are run on
          # demand with `pytest -m slow`. The board-dependent FPGA tests also
          # self-skip without hardware, so the suite is green on a stock runner.
          python -m pytest -q

  csim:
    name: csim (HLS kernel testbenches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile + run the HLS kernel CSIM testbenches
        run: |
          # The bundled HLS kernels compile as plain C++ (the forge_hls_types.hpp
          # shim maps ap_int<> to int16/int32 under g++), so these functional
          # testbenches run on a stock runner with no Xilinx toolchain. They check the
          # C++ kernel behavior against their encoded references; they do not synthesize
          # hardware or establish DSP utilization, routed timing, or silicon behavior.
          set -ex
          HLS=tikitorch/hardware/hls/forge_kernels
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step.cpp "$HLS"/forge_train_step_tb.cpp -o /tmp/tb_lm
          /tmp/tb_lm
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step_morph.cpp "$HLS"/forge_train_step_morph_tb.cpp -o /tmp/tb_morph
          /tmp/tb_morph
          # Dyadic MuZero forward-kernel functional testbench.
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step_muzero.cpp "$HLS"/forge_train_step_muzero_tb.cpp -o /tmp/tb_muzero
          /tmp/tb_muzero
          # Dyadic MuZero fused-training functional testbench. Shift/add/sign-product
          # design intent is verified physically only by configuration-matched reports.
          g++ -O2 -std=c++17 -DCSIM_ONLY -I"$HLS" -I tikitorch/hardware/hls \
              "$HLS"/forge_train_step_muzero_train.cpp "$HLS"/forge_train_step_muzero_train_tb.cpp -o /tmp/tb_muzero_train
          /tmp/tb_muzero_train

  docs:
    name: docs (mkdocs build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the API docs site
        run: |
          # mkdocstrings reads the in-source docstrings statically (griffe), so the
          # API reference can't drift from the code. Strict mode also turns broken
          # internal links and documentation warnings into release-blocking failures.
          python -m pip install --upgrade pip
          pip install mkdocs-material "mkdocstrings[python]"
          mkdocs build --strict

  closure-audit:
    name: closure-audit (software recipe checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (CPU torch + numpy + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          pip install -e ".[dev]"
      - name: Audit the closed model zoo (tt-closure CLI)
        run: |
          # `tt-closure` checks the registered software structure and supported executed
          # paths for these concrete models. A pass is useful software evidence, not a
          # proof of unexecuted branches or physical multiplier/DSP utilization.
          set -ex
          tt-closure tikitorch.models:TropicalForwardForward
          tt-closure tikitorch.models:DyadicForwardForward
      - name: Closure test suite (assert_closed / find_*_multiplies)
        run: |
          # Structural + traced-forward + training-loop closure assertions over the
          # layers, predictive-coding nets, and forward-forward models.
          python -m pytest -q tests/test_audit.py tests/test_closure_guard.py \
            tests/test_forward_forward.py tests/test_predictive_coding.py

  package:
    name: package (sdist, wheel, metadata, import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=5.0"

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install and import the wheel outside the checkout
        run: |
          # This verifies the distributable Python library. Native drivers and complete
          # HLS/HDK reproduction require a source checkout and external vendor tooling.
          python -m venv "$RUNNER_TEMP/tikitorch-wheel-smoke"
          "$RUNNER_TEMP/tikitorch-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/tikitorch-wheel-smoke/bin/python" -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/tikitorch-wheel-smoke/bin/python" -m pip install numpy
          "$RUNNER_TEMP/tikitorch-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tikitorch-wheel-smoke/bin/python" -c \
            'import importlib.metadata as md, tikitorch as tt; assert md.version("tikitorch") == tt.__version__; assert tt.models is not None; assert tt.optim is not None; print(tt.__version__)'
          "$RUNNER_TEMP/tikitorch-wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/tikitorch-wheel-smoke/bin/tt-closure" --help
